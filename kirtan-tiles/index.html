function start(i,p=practice){if(i<0||i>=songs.length||(!p&&i>=state.unlocked))return;stopRun();practice=p;selectedSong=i;let s=songs[i];page='game';app.dataset.page='game';app.dataset.skin=state.skin;nav.hidden=true;modal.innerHTML='';gameShell(s);let notes=chart(s);run={song:s,notes,active:false,paused:false,score:0,combo:0,max:0,hits:0,weighted:0,done:0,perfect:0,great:0,good:0,miss:0,origin:0,clockAudio:false,position:0,audioIdx:0,beatIdx:0,version:++screenVersion};let mine=run;initAudio().then(ok=>{if(run!==mine||page!=='game'||mine.paused||mine.active||mine.finished)return;beginClock(0,ok)});let version=mine.version;setTimeout(()=>{if(run===mine&&run.version===version&&!run.active&&!run.paused)beginClock(0,false)},700)}

function schedule(now){if(!run.clockAudio||!ac||ac.state!=='running')return;let r=run,s=r.song,beat=60/s.bpm;while(r.audioIdx<r.notes.length&&r.notes[r.audioIdx].time<=now+.17){let n=r.notes[r.audioIdx++];if(n.time>=now-.05)flute(n.note,r.origin+n.time,beat*(s.kind==='hard'?.38:.62))}while(r.beatIdx<s.bars*4&&r.beatIdx*beat<=now+.17){let j=r.beatIdx++,at=r.origin+j*beat;if(at<ac.currentTime-.05)continue;percussion(Math.max(ac.currentTime+.005,at),j%4===0||j%4===2);voice(freq(s.root-12+(j%4===1?7:0)),at,beat*.7,.055,'triangle');voice(2700,at+beat*.5,.075,.018,'sine')}}
function hud(){if(!run)return;$('score').textContent=fmt(run.score);$('combo').textContent=run.combo+'×';$('acc').textContent=(run.done?Math.round(run.weighted/run.done*100):100)+'%'}
function judged(kind,lane){const j=$('judge');j.className='judgment '+(kind==='miss'?'miss':'');j.innerHTML=t(kind)+(run.combo>=3?'<small>'+run.combo+' '+t('combo')+'</small>':'');void j.offsetWidth;j.classList.add('show');if(lane!==undefined){let a=$('lane'+lane),b=$('pad'+lane);a.classList.add('lit');b.classList.add('pressed');setTimeout(()=>{a.classList.remove('lit');b.classList.remove('pressed')},100)}feedback(kind)}
function register(n,kind){if(n.status)return;n.status=kind==='miss'?2:1;run.done++;if(n.el){n.el.remove();n.el=null}if(kind==='miss'){run.miss++;run.combo=0}else{run[kind]++;run.hits++;run.combo++;run.max=Math.max(run.max,run.combo);let w=kind==='perfect'?1:kind==='great'?.8:.55;run.weighted+=w;run.score+=Math.round(w*100)*(1+Math.floor(run.combo/12))}hud();judged(kind,kind==='miss'?undefined:n.lane)}
function hit(lane){if(!run||!run.active||run.paused)return;let now=clock()-state.offset/1000;if(now<-.23)return;if(!run.tapTimes)run.tapTimes=[-99,-99,-99,-99];if(now-run.tapTimes[lane]<.065)return;run.tapTimes[lane]=now;let note=null,dist=.23;for(const n of run.notes){if(n.status||n.lane!==lane)continue;let d=Math.abs(n.time-now);if(d<dist){note=n;dist=d}if(n.time>now+.24)break}if(note){register(note,dist<=.075?'perfect':dist<=.135?'great':'good')}else{let a=$('lane'+lane),b=$('pad'+lane);a.classList.add('lit');b.classList.add('pressed');setTimeout(()=>{a.classList.remove('lit');b.classList.remove('pressed')},75);run.combo=0;hud()}}
function frame(){let r=run;if(!r||!r.active||r.paused)return;if(r.clockAudio&&ac&&ac.state!=='running'){pause();return}const now=clock(),visual=now-state.offset/1000,stage=$('stage'),h=stage.clientHeight,line=h*.82,travel=r.song.kind==='hard'?1.5:r.song.kind==='medium'?1.8:2.05;const count=$('countdown');count.hidden=now>=0;if(now<0)$('count').textContent=String(Math.max(1,Math.ceil(-now)));schedule(now);let finishAt=r.song.bars*4*60/r.song.bpm+.55;$('progress').style.width=Math.max(0,Math.min(100,now/finishAt*100))+'%';for(const n of r.notes){if(n.status)continue;if(n.time<visual-.23){register(n,'miss');continue}if(n.time-visual>travel+.3)break;if(!n.el){let el=document.createElement('div');el.className='note';el.style.setProperty('--lane',n.lane);el.innerHTML=ic(laneIcons[n.lane]);$('notes').append(el);n.el=el}let y=line-(n.time-visual)/travel*line-n.el.offsetHeight/2;n.el.style.transform='translate3d(0,'+y.toFixed(1)+'px,0)'}if(now>=finishAt+.25){finish();return}raf=requestAnimationFrame(frame)}
function pause(){if(!run||run.paused||run.finished)return;run.position=Math.max(0,clock());run.active=false;run.paused=true;cancelAnimationFrame(raf);stopVoices();modal.innerHTML='<div class="dialog-back"><section class="dialog" role="dialog" aria-modal="true"><div class="badge">'+sname(run.song)+'</div><h2>'+t('paused')+'</h2><p>'+t('tap')+'</p>'+button('resume','resume','play','play')+button('retry','retry')+button('exit','songs')+'</section></div>'}
function resume(){if(!run||!run.paused)return;modal.innerHTML='';let r=run;initAudio().then(ok=>{if(run===r&&r.paused)beginClock(r.position,ok)})}
function finish(){let r=run;if(!r||r.finished)return;r.finished=true;stopRun();let acc=r.notes.length?r.weighted/r.notes.length:0,passed=acc>=.6,st=acc>=.9?3:acc>=.75?2:passed?1:0;if(!practice){let prev=state.best[r.song.id]||{score:0,stars:0};state.best[r.song.id]={score:Math.max(prev.score||0,r.score),stars:Math.max(prev.stars||0,st),accuracy:Math.max(prev.accuracy||0,acc)};if(passed)state.unlocked=Math.max(state.unlocked,Math.min(songs.length,selectedSong+2));save()}feedback(passed?'win':'lose');modal.innerHTML='<div class="dialog-back"><section class="dialog" role="dialog" aria-modal="true"><span class="badge">'+t(practice?'practiceOnly':'finished')+'</span><div class="result-art">'+art('result')+'</div><div class="result-stars">'+('★'.repeat(st)+'☆'.repeat(3-st))+'</div><h2>'+t(passed?'complete':'again')+'</h2><p style="margin:3px 0 0">'+sname(r.song)+'</p><div class="result-score">'+fmt(r.score)+'</div><div class="metrics"><div><small>'+t('accuracy')+'</small><b>'+Math.round(acc*100)+'%</b></div><div><small>'+t('max')+'</small><b>'+r.max+'×</b></div><div><small>'+t('hits')+'</small><b>'+r.hits+'/'+r.notes.length+'</b></div></div>'+(passed&&!practice&&selectedSong<songs.length-1?button('next','next','play','play'):button('retry','retry','play','refresh'))+button(passed&&!practice&&selectedSong<songs.length-1?'retry':'exit',passed&&!practice&&selectedSong<songs.length-1?'retry':'songs')+button('home','home')+'</section></div>'}
function action(a){let [k,v]=a.split(':');if(k==='home'){practice=false;render('home')}else if(k==='songs'){practice=false;filter='all';render('songs')}else if(k==='settings'||k==='collection')render(k);else if(k==='play'){practice=false;start(Math.min(state.unlocked-1,songs.length-1),false)}else if(k==='practice'){practice=true;filter='all';render('songs')}else if(k==='daily'){let d=new Date(),i=(d.getFullYear()*372+(d.getMonth()+1)*31+d.getDate())%songs.length;start(i,true)}else if(k==='filter'){filter=v;render('songs')}else if(k==='song')start(+v);else if(k==='skin'){let s=skins.find(x=>x.id===v);if(s&&starCount()>=s.cost){state.skin=s.id;save();render('collection')}}else if(k==='pause')pause();else if(k==='resume')resume();else if(k==='retry')start(selectedSong,practice);else if(k==='next')start(Math.min(selectedSong+1,songs.length-1),false);else if(k==='games')location.href='../'}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(b&&!b.disabled)action(b.dataset.act)});document.addEventListener('input',e=>{let k=e.target.id;if(['music','effects','offset'].includes(k)){state[k]=+e.target.value;if(k==='offset')$('offset-value').textContent=state.offset+' ms';if(ac){bus.gain.value=state.music/100*.65;fx.gain.value=state.effects/100*.65}save()}});document.addEventListener('change',e=>{if(e.target.id==='language'){state.lang=e.target.value;save();render('settings')}});document.addEventListener('keydown',e=>{let i=['d','f','j','k'].indexOf(e.key.toLowerCase());if(page==='game'&&i>=0&&!e.repeat){e.preventDefault();hit(i)}if(page==='game'&&e.key==='Escape'){if(run?.paused)resume();else pause()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&page==='game'&&run?.active)pause()});window.addEventListener('pagehide',()=>{if(page==='game'&&run?.active)pause();else stopVoices()});
render('home');if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{})}
