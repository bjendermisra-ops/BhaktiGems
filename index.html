async function move(a,b){if(page!=='game'||busy||paused||!E.adjacent(a,b))return;busy=true;$('board').classList.add('is-busy');clearSelect();try{await animateSwap(a,b);E.swap(game,a,b);renderBoard();const forced=[a,b].filter(i=>game.powers[i]);if(!E.runs(game.board).length&&!forced.length){sfx('bad');await animateSwap(a,b);E.swap(game,a,b);renderBoard();return}game.moves--;renderHUD();await resolve(b,forced);if(E.won(game)||game.moves<=0)finish(E.won(game))}catch(e){console.error(e);E.shuffle(game);renderBoard();renderHUD();snapshot();toast(tr('error'))}finally{busy=false;$('board')?.classList.remove('is-busy')}}
async function hammerAt(i){if(busy||paused||!hammer||state.boost[0]<=0)return;busy=true;hammer=false;state.boost[0]--;try{await resolve(-1,[i]);if(E.won(game)||game.moves<=0)finish(E.won(game))}catch(e){E.shuffle(game);renderBoard();renderHUD();snapshot();toast(tr('error'))}finally{busy=false;$('board')?.classList.remove('is-busy')}}
function tapCell(i){if(busy||paused||page!=='game')return;if(hammer){hammerAt(i);return}if(selected===i){clearSelect();return}if(E.adjacent(selected,i)){move(selected,i);return}clearSelect();selected=i;cell(i)?.classList.add('selected');cell(i)?.setAttribute('aria-pressed','true');sfx('tap')}
function booster(i){if(busy||paused)return;if(!state.boost[i]){toast(tr('noBooster'));return}if(i===0){hammer=!hammer;clearSelect();renderHUD();toast(tr(hammer?'tapHammer':'cancelled'));return}state.boost[i]--;hammer=false;clearSelect();if(i===1){E.shuffle(game);renderBoard(Object.fromEntries(E.range(E.N).map(i=>[i,1])))}else game.moves+=5;renderHUD();snapshot();sfx('reward')}
function modal(type,content,cls=''){modalType=type;$('modal').innerHTML='<div class="overlay"><section role="dialog" aria-modal="true" class="dialog '+cls+'">'+content+'</section></div>';requestAnimationFrame(()=>$('modal').querySelector('button')?.focus({preventScroll:true}))}
function closeModal(){modalType='';$('modal').innerHTML=''}
function celebrate(){if(!state.motion)return;for(let i=0;i<26;i++){const el=document.createElement('span');el.className='particle '+(i%4===0?'gold':'');el.style.left=(Math.random()*100)+'vw';el.style.animationDelay=Math.random()*.75+'s';el.style.setProperty('--drift',Math.round(Math.random()*100-50)+'px');$('particles').append(el);setTimeout(()=>el.remove(),2900)}}
function finish(ok){paused=true;clearSelect();hammer=false;state.active=null;if(ok){let count=E.stars(game),previous=state.stars[game.level]||0,high=game.score>(state.scores[game.level]||0);state.stars[game.level]=Math.max(count,previous);state.scores[game.level]=Math.max(game.score,state.scores[game.level]||0);const reward=previous?20:100+count*20,gems=previous?Math.max(0,count-previous):count;state.coins+=reward;state.gems+=gems;state.unlocked=Math.min(100,Math.max(state.unlocked,game.level+1));persist();resourceBar();sfx('win');celebrate();modal('win',ribbon('win')+'<div class="stars">'+E.range(3).map(i=>pic(S+(i<count?'star':'star-empty'))).join('')+'</div><div class="result-art">'+pic(R+'krishna-win')+'<div class="result-score">'+tr('score')+'<strong>'+fmt(game.score)+'</strong>'+(high?'<small>'+tr('newHigh')+'</small>':'')+'</div></div><div class="smallpanel"><h3>'+tr('objective')+'</h3><div class="targets">'+targetMarkup(game)+'</div></div><div class="smallpanel"><h3>'+tr('rewards')+'</h3><div class="reward-line"><span>'+pic(S+'coin')+'+'+fmt(reward)+'</span><span>'+pic(S+'gem-pink')+'+'+gems+'</span></div></div>'+(game.level%5===0?'<div class="smallpanel"><h3>'+tr('story')+'</h3><p class="hinttext">'+tr('story'+(Math.floor((game.level-1)/20)+1))+'</p></div>':'')+wide(game.level===100?'finished':'nextLevel',game.level===100?'levels':'nextLevel')+'<div class="rowbtn">'+button('replay','replay')+button('home','home')+'</div>','result')}else{persist();sfx('lose');modal('lose',ribbon('lose')+'<div class="result-art">'+pic(D+'krishna-surprised')+'<div class="result-score"><h3>'+tr('out')+'</h3><p class="hinttext">'+tr('encourage')+'</p></div></div><div class="smallpanel"><h3>'+tr('remaining')+'</h3><div class="targets">'+targetMarkup(game)+'</div></div>'+wide('replay','replay')+wide(tr('extra')+' +5 ('+state.boost[2]+')','continueLose','purple').replace('data-action="continueLose"','data-action="continueLose" '+(state.boost[2]?'':'disabled'))+wide('home','home','') ,'result')}}
function pause(){if(page!=='game'||busy||paused)return;paused=true;snapshot();modal('pause',ribbon('paused')+pic(D+'krishna-smile','story-art')+wide('resume','resume')+wide('replay','replayConfirm','purple')+wide('home','home','')+'<p class="hinttext">'+tr('confirmExit')+'</p>')}
function claim(){let d=dayKey();if(state.lastDay===d)return;state.coins+=(state.day%7+1)*20;state.day++;state.lastDay=d;persist();show('events',false);sfx('reward');toast(tr('giftAdded'))}
function buy(i){if(!Number.isInteger(i)||i<0||i>2)return;if(state.coins<boostPrices[i]){toast(tr('noCoins'));return}state.coins-=boostPrices[i];state.boost[i]++;persist();show('shop',false);sfx('reward');toast(tr('purchased'))}
function changeDecor(i){const d=decor[i];if(!d)return;if(state.placed.includes(i))state.placed=state.placed.filter(x=>x!==i);else{if(!state.owned.includes(i)){if(state.coins<d[2]){toast(tr('noCoins'));return}state.coins-=d[2];state.owned.push(i)}state.placed.push(i)}persist();show('mandir',false);sfx('place')}
function action(a,v){if(busy)return;if(['home','levels','shop','profile','mandir','events','settings'].includes(a)){if(page==='game'&&modalType!=='win'&&modalType!=='lose'&&E.valid(game))snapshot();if(a==='levels')chapter=Math.floor((state.unlocked-1)/20);show(a);return}if(a==='play'){start(state.active?.level||state.unlocked,!!state.active);return}if(a==='level'){start(+v);return}if(a==='chapter'){if(+v>=0&&+v<5){chapter=+v;show('levels')}return}if(a==='pause'){pause();return}if(a==='resume'){paused=false;closeModal();return}if(a==='replayConfirm'){modal('confirmReplay',ribbon('replay')+'<p>'+tr('confirmReplay')+'</p>'+wide('replay','replay')+wide('cancel','cancelReplay',''));return}if(a==='cancelReplay'){paused=false;closeModal();pause();return}if(a==='replay'){closeModal();start(game.level);return}if(a==='nextLevel'){closeModal();start(Math.min(100,game.level+1));return}if(a==='continueLose'){if(state.boost[2]>0){state.boost[2]--;game.moves+=5;paused=false;closeModal();renderHUD();snapshot();sfx('reward')}return}if(a==='hint'){if(paused)return;let h=E.legal(game.board,game.powers);if(h)for(const i of h){let el=cell(i);el.classList.remove('hint');void el.offsetWidth;el.classList.add('hint')}return}if(a==='boost'){booster(+v);return}if(a==='buy'){buy(+v);return}if(a==='decor'){changeDecor(+v);return}if(a==='filter'){filter=v;show('mandir',false);return}if(a==='saveDecor'){persist();toast(tr('saved'));sfx('reward');return}if(a==='resetDecor'){modal('reset',ribbon('reset')+'<p>'+tr('resetConfirm')+'</p>'+wide('confirm','resetYes')+wide('cancel','close',''));return}if(a==='resetYes'){state.placed=[];persist();show('mandir',false);return}if(a==='claim'){claim();return}if(a==='claimEvent'){if(!state.eventClaimed&&Object.keys(state.stars).length>=5){state.eventClaimed=true;state.coins+=250;state.gems+=5;persist();show('events',false);sfx('reward');celebrate();toast(tr('giftAdded'))}return}if(a==='toggle'&&['sound','music','motion'].includes(v)){state[v]=!state[v];if(v==='music'&&state.music){tone(261.63,.15,0,.01);syncMusic()}else if(v==='music')syncMusic();persist();show('settings',false);return}if(a==='help'){modal('help',ribbon('howTo')+pic(D+'krishna-smile','story-art')+'<p>'+tr('tutorial')+'</p><p>'+tr('tutorialGarden')+'</p>'+wide('gotIt','close'));return}if(a==='tutorialDone'||a==='gardenDone'){state[a==='tutorialDone'?'tutorial':'gardenTutorial']=true;persist();paused=false;closeModal();return}if(a==='close'){closeModal();return}}
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-cell]');if(el&&page==='game'&&!busy&&!paused){gesture={i:+el.dataset.cell,x:e.clientX,y:e.clientY,id:e.pointerId};try{el.setPointerCapture(e.pointerId)}catch{}}});document.addEventListener('pointercancel',()=>gesture=null);document.addEventListener('pointerup',e=>{if(!gesture||gesture.id!==e.pointerId)return;const g=gesture;gesture=null;let dx=e.clientX-g.x,dy=e.clientY-g.y;if(Math.max(Math.abs(dx),Math.abs(dy))<14)return;suppress=Date.now()+450;if(hammer)return;let j=g.i+(Math.abs(dx)>Math.abs(dy)?(dx>0?1:-1):(dy>0?7:-7));if(E.adjacent(g.i,j))move(g.i,j)});
document.addEventListener('click',e=>{if(state.music&&!musicTimer){tone(261.63,.09,0,.005);syncMusic()}const tile=e.target.closest('[data-cell]');if(tile){if(Date.now()>suppress)tapCell(+tile.dataset.cell);return}const el=e.target.closest('[data-action]');if(!el||el.disabled)return;let [a,v]=el.dataset.action.split(':');if(a!=='boost'&&a!=='hint')sfx('tap');action(a,v)});
document.addEventListener('change',e=>{if(e.target.id==='language'&&['en','hi','mr'].includes(e.target.value)){state.lang=e.target.value;persist();show('settings',false)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalType==='pause'){paused=false;closeModal()}else if(['help','reset'].includes(modalType))closeModal();else if(page==='game'&&!modalType)pause();else if(page!=='home'&&!modalType)show('home')}if(e.key==='Tab'&&modalType){let buttons=[...$('modal').querySelectorAll('button:not([disabled]),select')];if(!buttons.length)return;const first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(musicTimer);musicTimer=null;if(page==='game'&&!busy&&!paused)pause()}else if(state.music)syncMusic()});window.addEventListener('pagehide',()=>{if(page==='game'&&!busy&&!paused&&E.valid(game))snapshot()});
for(const art of [...pieceArt,...Object.values(powerArt)]){const im=new Image();im.src=assetPath(art);if(im.decode)im.decode().catch(()=>{})}show('home');window.__bhaktiReady=true;try{if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(function(r){return r.update()}).catch(function(){})}catch(_e){};

})();}catch(e){window.__bhaktiFail(e)}</script></body></html>
