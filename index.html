function start(l,resume=false){if(busy||l<1||l>100||l>save.unlocked)return;session++;paused=false;page='game';selected=-1;boostMode=false;game=resume&&save.active?.level===l?JSON.parse(JSON.stringify(save.active)):{level:l,board:fresh(),powers:{},score:0,...levelConfig(l)};updateBar();nav();$('screen').innerHTML='<div class="top">'+btn('Ⅱ','pause')+'<div class="ribbon">Level '+l+'</div>'+btn('💡','hint')+'</div><div class="hud"><div class="stat">Moves<strong id="moves"></strong></div><div class="stat">Score<strong id="score"></strong></div></div><div class="panel targets" id="targets"></div><div id="board" class="board" role="group" aria-label="Match three board"></div><div class="boosters" id="boosters"></div><p class="muted" style="text-align:center">Swipe adjacent gems or tap two tiles to match 3.</p>';render();snapshot();if(won()||game.moves<=0)finish(won())}
function render(fall=false){if(page!=='game')return;$('moves').textContent=game.moves;$('score').textContent=game.score;$('targets').innerHTML=Object.entries(game.targets).map(([k,v])=>'<div class="target">'+art(+k)+'<span>'+ (v<=0?'✓':v)+'</span></div>').join('');$('board').innerHTML=game.board.map((k,i)=>'<button aria-label="'+names[k]+' row '+(1+Math.floor(i/W))+' column '+(1+i%W)+'" class="tile art '+(selected===i?'selected ':'')+(fall?'fall ':'')+(game.powers[i]?'special':'')+'" style="--kind:'+k+'" data-cell="'+i+'" data-power="'+(game.powers[i]||'')+'"><i>'+icons[k]+'</i></button>').join('');$('boosters').innerHTML=[['🔨','Hammer'],['🔀','Shuffle'],['➕','Moves +5']].map((x,i)=>'<button data-action="boost:'+i+'" class="'+(boostMode&&i===0?'chosen':'')+'"><b>'+x[0]+'</b>'+x[1]+' · '+save.boost[i]+'</button>').join('')}
function snapshot(){if(!game)return;save.active=JSON.parse(JSON.stringify(game));persist()}
function won(){return Object.values(game.targets).every(v=>v<=0)}
function anim(ms){return wait(save.motion?ms:0)}
function combo(n){if(!save.motion)return;let el=document.createElement('div');el.className='combo';el.textContent=n>1?'Combo ×'+n+'!':'Wonderful!';$('board').append(el);setTimeout(()=>el.remove(),750)}
function fall(){let b=game.board,p=game.powers,next={};for(let c=0;c<W;c++){let w=H-1;for(let r=H-1;r>=0;r--){let i=r*W+c;if(b[i]!==-1){let j=w*W+c;b[j]=b[i];if(p[i])next[j]=p[i];w--}}for(;w>=0;w--)b[w*W+c]=random()}game.powers=next}
async function clearCells(ids){let set=new Set(ids),queue=[...set];for(let i of queue){let p=game.powers[i];let extra=[];if(p==='↔')extra=Array.from({length:W},(_,j)=>Math.floor(i/W)*W+j);if(p==='↕')extra=Array.from({length:H},(_,j)=>j*W+i%W);if(p==='✦')extra=game.board.flatMap((k,j)=>k===game.board[i]?[j]:[]);if(p==='✿')extra=game.board.flatMap((k,j)=>Math.abs(j%W-i%W)<=1&&Math.abs(Math.floor(j/W)-Math.floor(i/W))<=1?[j]:[]);for(let j of extra)if(!set.has(j)){set.add(j);queue.push(j)}}for(let i of set){let k=game.board[i];if(k<0)continue;if(k in game.targets)game.targets[k]=Math.max(0,game.targets[k]-1);game.score+=50;delete game.powers[i];$('board').querySelector('[data-cell="'+i+'"]')?.classList.add('pop');game.board[i]=-1}sound(440+Math.min(set.size,18)*25);await anim(220);fall();render(true);await anim(240)}
async function settle(preferred=-1,first=null){let chain=0;if(first)await clearCells(first);while(chain<35){let runs=matches(game.board);if(!runs.length)break;chain++;let ids=new Set(runs.flat()),created=[];for(let run of runs){if(run.length>=4){let at=run.includes(preferred)?preferred:run[Math.floor(run.length/2)];if(!game.powers[at]&&!created.some(x=>x[0]===at)){created.push([at,run.length>=5?'✦':run[1]-run[0]===1?'↔':'↕']);ids.delete(at)}}}for(let i of ids){if(runs.filter(r=>r.includes(i)).length>1&&!game.powers[i]){created.push([i,'✿']);ids.delete(i);break}}for(let [i,p] of created)game.powers[i]=p;combo(chain);await clearCells(ids);preferred=-1}if(matches(game.board).length||!legal(game.board)){game.board=fresh();game.powers={};toast('Board refreshed!')}render();snapshot()}
async function attempt(a,b){if(busy||paused||!adjacent(a,b))return;busy=true;selected=-1;try{let board=game.board;swap(board,a,b);let p=game.powers,pa=p[a],pb=p[b];delete p[a];delete p[b];if(pa)p[b]=pa;if(pb)p[a]=pb;render();await anim(120);if(!matches(board).length&&!pa&&!pb){swap(board,a,b);delete p[a];delete p[b];if(pa)p[a]=pa;if(pb)p[b]=pb;render();sound(220);return}game.moves--;await settle(b,pa||pb?[...(pa?[b]:[]),...(pb?[a]:[])]:null);if(won()||game.moves<=0)finish(won())}catch(e){toast('Board recovered');game.board=fresh();game.powers={};render();snapshot()}finally{busy=false}}
function tap(i){if(busy||paused)return;if(boostMode){useHammer(i);return}if(selected===i){selected=-1;render();return}if(selected>=0&&adjacent(selected,i)){attempt(selected,i);return}selected=i;render()}
async function useHammer(i){if(busy||save.boost[0]<=0)return;busy=true;boostMode=false;save.boost[0]--;try{await settle(-1,[i]);if(won()||game.moves<=0)finish(won())}finally{busy=false}}
function useBoost(i){if(busy||paused)return;if(save.boost[i]<=0){toast('Earn more coins and visit boosters.');return}if(i===0){boostMode=!boostMode;selected=-1;render();toast(boostMode?'Tap a tile to clear it':'Hammer cancelled');return}save.boost[i]--;if(i===1){game.board=fresh();game.powers={};sound(500)}else game.moves+=5;render();snapshot()}
function modal(body){$('modal').innerHTML='<div class="overlay"><section class="dialog" role="dialog" aria-modal="true">'+body+'</section></div>';$('modal').querySelector('button')?.focus()}
function closeModal(){$('modal').innerHTML=''}
function celebrate(){if(!save.motion)return;for(let i=0;i<18;i++){let e=document.createElement('span');e.className='petal';e.textContent=i%3?'🌸':'✨';e.style.left=(Math.random()*95)+'vw';e.style.top='-8vh';e.style.animationDelay=(Math.random()*.6)+'s';document.body.append(e);setTimeout(()=>e.remove(),2800)}}
function finish(ok){paused=true;save.active=null;if(ok){let stars=game.moves>=10?3:game.moves>=4?2:1,old=save.stars[game.level]||0;save.stars[game.level]=Math.max(stars,old);let reward=old?20:100+stars*20;save.coins+=reward;if(!old)save.gems+=stars;save.unlocked=Math.min(100,Math.max(save.unlocked,game.level+1));persist();updateBar();sound(780);celebrate();modal('<h2 class="ribbon">'+t('Level Complete!')+'</h2><div class="stars">'+'★'.repeat(stars)+'☆'.repeat(3-stars)+'</div><h2>'+game.score+' points</h2><p>🟡 +'+reward+' · Great seva!</p>'+(game.level%5===0?'<p class="muted">Seva story: Caring for nature and animals is a beautiful way to practice kindness.</p>':'')+btn(game.level===100?'Levels':'Next Level',game.level===100?'levels':'next','green')+btn('Replay','replay')+btn('Home','home'))}else{persist();modal('<h2 class="ribbon">'+t('Try Again!')+'</h2><div style="font-size:66px">🪷</div><h3>Out of moves</h3><p>Every try is a chance to learn.</p><p>'+Object.entries(game.targets).map(([k,v])=>icons[k]+' '+v).join(' · ')+'</p>'+btn('Replay','replay','green')+btn('Extra moves ('+save.boost[2]+')','continue')+btn('Home','home'))}}
function pause(){if(busy||paused)return;paused=true;snapshot();modal('<h2 class="ribbon">Paused</h2>'+btn('Resume','resume','green')+btn('Replay','replay')+btn('Home','home'))}
let down=null,suppress=0;document.addEventListener('pointerdown',e=>{let el=e.target.closest('[data-cell]');if(el&&!busy&&!paused){down={i:+el.dataset.cell,x:e.clientX,y:e.clientY,id:e.pointerId};try{el.setPointerCapture(e.pointerId)}catch{}}});document.addEventListener('pointercancel',()=>down=null);document.addEventListener('pointerup',e=>{if(!down||down.id!==e.pointerId)return;let d=down;down=null;let dx=e.clientX-d.x,dy=e.clientY-d.y;if(Math.max(Math.abs(dx),Math.abs(dy))<14)return;suppress=Date.now()+450;let j=d.i+(Math.abs(dx)>Math.abs(dy)?(dx>0?1:-1):(dy>0?W:-W));if(j>=0&&j<N&&adjacent(d.i,j)&&!boostMode)attempt(d.i,j)});
document.addEventListener('click',e=>{let cell=e.target.closest('[data-cell]');if(cell){if(Date.now()>suppress)tap(+cell.dataset.cell);return}let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let [a,v]=b.dataset.action.split(':');if(['home','levels','mandir','shop','settings','events'].includes(a)){if(busy)return;if(a==='levels')chapter=Math.floor((save.unlocked-1)/20);show(a);return}if(a==='play'){start(save.active?.level||save.unlocked,!!save.active);return}if(a==='level'){start(+v);return}if(a==='chapter'){chapter=+v;page='levels';show('levels');return}if(a==='pause'){pause();return}if(a==='resume'){paused=false;closeModal();return}if(a==='next'||a==='replay'){if(busy)return;let l=game.level+(a==='next'?1:0);closeModal();start(l);return}if(a==='continue'){if(!save.boost[2]){toast('No extra moves available');return}save.boost[2]--;game.moves+=5;paused=false;closeModal();render();snapshot();return}if(a==='hint'){if(busy||paused)return;let h=legal(game.board);if(h)h.forEach(i=>$('board').querySelector('[data-cell="'+i+'"]')?.classList.add('hint'));return}if(a==='boost'){useBoost(+v);return}if(a==='buy'){let i=+v,c=[80,60,100][i];if(save.coins<c){toast('Not enough coins');return}save.coins-=c;save.boost[i]++;persist();show('shop');sound(650);return}if(a==='decor'){let i=+v;if(save.placed.includes(i))save.placed=save.placed.filter(x=>x!==i);else{if(!save.owned.includes(i)){if(save.coins<decor[i][2]){toast('Not enough coins');return}save.coins-=decor[i][2];save.owned.push(i)}save.placed.push(i)}persist();show('mandir');sound(660);return}if(a==='claim'){let d=localDay();if(save.lastDay===d){toast('Already claimed');return}save.coins+=(save.day%7+1)*20;save.day++;save.lastDay=d;persist();show('events');sound(740);return}if(a==='sound'||a==='motion'){save[a]=!save[a];persist();show('settings')}});
document.addEventListener('change',e=>{if(e.target.id==='lang'){save.lang=e.target.value;persist();show('settings')}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&page==='game'&&!busy&&!paused)pause()});window.addEventListener('pagehide',()=>{if(page==='game'&&!busy&&!paused)snapshot()});
let foliage=$('foliage');for(let i=0;i<100;i++){let x=(i*71)%420,y=i<65?(i*23)%115:180+(i*37)%540;if(i>=65)x=i%2?18:402;let e=document.createElementNS('http://www.w3.org/2000/svg','ellipse');e.setAttribute('cx',x);e.setAttribute('cy',y);e.setAttribute('rx',12+i%10);e.setAttribute('ry',7+i%8);e.setAttribute('transform','rotate('+((i*19)%180)+' '+x+' '+y+')');e.setAttribute('fill',['#267d37','#559d38','#a5bc40','#f6ad2c'][i%4]);foliage.append(e)}show('home');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script><script src="art.js"></script></body></html>
